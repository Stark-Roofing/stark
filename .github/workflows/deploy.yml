name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    # ── Step 1: Fetch Google reviews (non-fatal) ──
    - name: Fetch Google reviews
      continue-on-error: true
      env:
        GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      run: node scripts/fetch-google-reviews.mjs

    # ── Step 2: Vite build (must succeed) ──
    - name: Vite build
      run: npm run build

    # ── Step 3: Prerender with Puppeteer ──
    - name: Install Puppeteer system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libxdamage1 libxkbcommon0 libpango-1.0-0 libcairo2 libasound2 libnspr4 libnss3 libgbm1 || true

    - name: Install Puppeteer browser
      run: npx puppeteer browsers install chrome

    # NOTE: no continue-on-error here on purpose. A Puppeteer failure on any
    # single page must stop the deploy immediately and loudly — see the
    # "Verify all pages were really prerendered" step below for why silently
    # continuing here is exactly how generic fallback content shipped to
    # production undetected in the past.
    - name: Prerender static HTML
      run: node scripts/prerender.mjs

    # ── Step 4: Fill gaps for any pages prerender missed ──
    - name: Generate fallback HTML for missing blog pages
      run: node scripts/generate-blog-fallbacks.mjs

    - name: Generate fallback HTML for all remaining pages
      run: node scripts/generate-all-fallbacks.mjs

    # ── Step 5: Verify every sitemap page was really prerendered ──
    # Checks every URL in sitemap.xml (not just a hardcoded handful) against
    # dist/, using the same "is #root empty" signal the fallback generator
    # scripts themselves use to decide whether a page needs a fallback — a
    # deterministic, page-agnostic way to detect fallback/boilerplate content
    # that requires no maintenance as pages are added. See
    # scripts/verify-prerendered-content.mjs for the full explanation.
    - name: Verify all pages were really prerendered
      run: node scripts/verify-prerendered-content.mjs

    # ── Deploy ──
    - name: Create 404.html fallback for unknown URLs
      run: cp dist/index.html dist/404.html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # ── Notify IndexNow (Bing + AI search engines) of the current URL set ──
    # Non-fatal: a failed ping must never affect the deploy. Ownership is proven
    # by public/d0f2a7c14b9e4a3f8c6b5d0e1a2f3b4c.txt shipped at the site root.
    - name: Ping IndexNow
      continue-on-error: true
      run: |
        node --input-type=module <<'EOF'
        import { readFileSync } from 'node:fs';
        const KEY = 'd0f2a7c14b9e4a3f8c6b5d0e1a2f3b4c';
        const HOST = 'starkroofingrenovation.com';
        const xml = readFileSync('public/sitemap.xml', 'utf8');
        const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)]
          .map(m => m[1].trim())
          .filter(u => !u.toLowerCase().endsWith('.xml'));
        const body = {
          host: HOST,
          key: KEY,
          keyLocation: `https://${HOST}/${KEY}.txt`,
          urlList: urls.slice(0, 10000),
        };
        const res = await fetch('https://api.indexnow.org/indexnow', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify(body),
        });
        console.log(`IndexNow: HTTP ${res.status} for ${urls.length} URLs`);
        EOF
